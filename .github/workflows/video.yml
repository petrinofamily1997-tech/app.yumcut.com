name: Video Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install YumCut dependencies
        run: |
          npm install
          npx prisma generate
          npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "12345"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Start YumCut server
        run: |
          nohup npm start &
          sleep 20
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "12345"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Wait for YumCut to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ YumCut is ready"
              exit 0
            fi
            echo "⏳ Waiting for YumCut... ($i/30)"
            sleep 5
          done
          echo "❌ YumCut did not start"
          exit 1

      - name: Run video bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YUMCUT_URL: "http://localhost:3000"
          YUMCUT_API_KEY: "test"
        run: python video_bot.py

      - name: Upload video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/video.mp4