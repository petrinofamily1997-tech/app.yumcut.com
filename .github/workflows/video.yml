name: Smart Montage Bot

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
          sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Важно: Pillow ниже 10.0.0 исправляет ошибку ANTIALIAS в MoviePy
          pip install "Pillow<10.0.0"
          pip install moviepy==1.0.3 edge-tts groq requests python-dotenv

      - name: Generate Smart Video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python video_bot.py

      - name: Upload Video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-video-${{ github.run_number }}
          path: output/video.mp4
