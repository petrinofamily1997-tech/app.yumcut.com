name: Video Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install YumCut dependencies
        run: |
          npm install
          npx prisma generate
          npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "12345"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Start YumCut server
        run: |
          nohup npm start &
          sleep 15
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "12345"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Run video bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YUMCUT_URL: "http://localhost:3000"
          YUMCUT_API_KEY: "test"
        run: python video_bot.py
